[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolratchet"
version = "0.1.0"
description = "Compatibility, token-budget and integrity gate for LLM tool definitions (MCP, OpenAI, Anthropic, Gemini)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "devXyi" }]
keywords = ["mcp", "model-context-protocol", "llm", "tools", "function-calling", "json-schema", "breaking-changes", "semver", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]

[project.scripts]
toolratchet = "toolratchet.cli:main"

[project.urls]
Homepage = "https://github.com/devXyi/toolratchet"
Issues = "https://github.com/devXyi/toolratchet/issues"

[tool.setuptools.packages.find]
where = ["src"]
